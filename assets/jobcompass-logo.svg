<svg width="480" height="140" viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JobCompass logo">
  <defs>
    <linearGradient id="jc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="jc-needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Compass mark -->
  <g transform="translate(70,70)">
    <circle r="54" fill="url(#jc-grad)"/>
    <circle r="54" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="43" fill="#ffffff"/>
    <!-- tick marks (cardinal points) -->
    <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-33"/>
      <line x1="0" y1="40" x2="0" y2="33"/>
      <line x1="-40" y1="0" x2="-33" y2="0"/>
      <line x1="40" y1="0" x2="33" y2="0"/>
    </g>
    <!-- needle: north half points up (green = hope/direction), south half blue -->
    <polygon points="0,-34 11,0 0,6 -11,0" fill="url(#jc-needle)"/>
    <polygon points="0,34 11,0 0,-6 -11,0" fill="#2563eb"/>
    <circle r="5.5" fill="#0f172a"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(140,0)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="68" font-size="42" font-weight="700" fill="#0f172a">Job</text>
    <text x="74" y="68" font-size="42" font-weight="700" fill="#2563eb">Compass</text>
    <text x="2" y="96" font-size="15" font-weight="400" fill="#64748b" letter-spacing="0.5">Find your direction to the right job</text>
  </g>
</svg>
